# AlphaCP get-server (D21) — installer distribution, secret path se protected.
server {
    listen 2099 ssl;
    listen [::]:2099 ssl;
    server_name _;
    ssl_certificate     /etc/ssl/alphacp/panel.crt;
    ssl_certificate_key /etc/ssl/alphacp/panel.key;
    root /var/www/alphacp-get;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = / { return 404; }
    location = /.secret { deny all; }
    location / { try_files $uri =404; }
}
