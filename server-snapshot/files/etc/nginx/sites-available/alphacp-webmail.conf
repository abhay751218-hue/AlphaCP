# AlphaCP Webmail (Roundcube) — cPanel-style port 2096 (webmail-fix v1.7)
server {
    listen 2096 ssl http2;
    listen [::]:2096 ssl http2;

    server_name _;

    ssl_certificate     /etc/ssl/alphacp/panel.crt;
    ssl_certificate_key /etc/ssl/alphacp/panel.key;

    root /usr/share/roundcube;
    index index.php;

    # panel-internal SSO endpoint isi vhost par expose NAHI ho
    location /internal/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ /\. { deny all; }
}
