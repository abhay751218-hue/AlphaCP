server {
    listen 8090 ssl http2;
    listen [::]:8090 ssl http2;
    server_name _;
    ssl_certificate     /etc/ssl/alphacp/panel.crt;
    ssl_certificate_key /etc/ssl/alphacp/panel.key;
    location / { default_type text/html; return 200 '<!doctype html><meta charset="utf-8"><title>AlphaCP</title><body style="font-family:sans-serif;background:#1c2733;color:#eef1f4;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h1>AlphaCP</h1><p><a style="color:#FF6C2C" href="https://$host:2087/">WHM &mdash; root / reseller</a></p><p><a style="color:#FF6C2C" href="https://$host:2083/">cPanel &mdash; customer</a></p><p><a style="color:#FF6C2C" href="https://$host:2096/">Webmail</a></p></div></body>'; }
}
