# AlphaCP phpMyAdmin — cPanel-style one-click SSO port (d12-pma v1.0)
server {
    listen 2098 ssl http2;
    listen [::]:2098 ssl http2;

    server_name _;

    ssl_certificate     /etc/ssl/alphacp/panel.crt;
    ssl_certificate_key /etc/ssl/alphacp/panel.key;

    root /usr/share/phpmyadmin;
    index index.php;

    # panel-internal SSO endpoint is vhost par expose NAHI hota
    location /internal/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ /\.    { deny all; }
    location ~ /(libraries|templates|setup) { deny all; }
}
